<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio">
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top" id="brand">Portfolio</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero container">
      <p class="eyebrow" id="location"></p>
      <h1 id="headline"></h1>
      <p class="hero-copy" id="description"></p>
    </section>

    <section id="work" class="section container">
      <div class="section-top">
        <div>
          <p class="section-kicker">01</p>
          <h2>Selected work</h2>
        </div>
        <p class="section-note">Video portfolio</p>
      </div>
      <div class="project-grid" id="projects"></div>
    </section>

    <section id="about" class="section section-soft">
      <div class="container two-col">
        <div>
          <p class="section-kicker">02</p>
          <h2>About</h2>
        </div>
        <div class="copy" id="bio"></div>
      </div>
    </section>

    <section id="services" class="section container">
      <div class="section-top">
        <div>
          <p class="section-kicker">03</p>
          <h2>Services</h2>
        </div>
      </div>
      <div class="service-grid" id="services-grid"></div>
    </section>

    <section id="contact" class="section section-dark">
      <div class="container two-col">
        <div>
          <p class="section-kicker">04</p>
          <h2>Contact</h2>
        </div>
        <div>
          <p class="contact-lead">Have a project in mind?</p>
          <div class="contact-links" id="contact-links"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> <span id="footer-name"></span></span>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
